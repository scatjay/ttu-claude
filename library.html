<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大同示範文獻庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f4f1ea;--surface:#fffdf8;--surface2:#efeadf;--ink:#211e1a;--muted:#6f685d;--hair:#e0d9cb;
  --accent:#7a2f6a;--accent2:#b0679f;--accent-soft:#ecd6e6;--warn:#b4552c;--onbrand:#fffdf8;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 6px 18px rgba(30,25,15,.05);
  --u1:#2f6fb0;--u2:#3f8f80;--u3:#8a6aa8;--u4:#c2703d;--u5:#a8522f;--u6:#7a2f6a;--uc:var(--u6);
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#18160f;--surface:#211e18;--surface2:#2a261e;--ink:#ece6d9;--muted:#a49b8b;--hair:#39342a;
  --accent:#d99ac8;--accent2:#e8b6da;--accent-soft:#40243a;--warn:#e0824f;--onbrand:#16130f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --u1:#7fb0e6;--u2:#7fcabc;--u3:#c0a6dc;--u4:#e0a37f;--u5:#e8a083;--u6:#d99ac8;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:15px;-webkit-font-smoothing:antialiased;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 頁首細列（學習單 .tabs） */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--hair);
  padding:8px 0;margin:0 auto;max-width:1260px;display:flex;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap}
.tabs .brand{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent);margin-right:10px;padding-left:2px}
.tabs a,.tabs .tab{font-size:13.5px;color:var(--muted);padding:6px 12px;border-radius:7px;text-decoration:none;flex:0 0 auto}
.tabs a:hover{background:var(--surface2);color:var(--ink)}
.tabs a.on{background:var(--accent);color:var(--onbrand);font-weight:700}
.tabs .sp{flex:1 1 auto}
main{max-width:880px;margin:0 auto;min-width:0;padding-block:clamp(24px,5vw,48px) 0}
.toc-wrap>main{padding-block:clamp(16px,3vw,32px) 0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;font-weight:600;color:var(--uc);text-transform:uppercase;overflow-wrap:anywhere}
h1{font-size:clamp(26px,5vw,44px);font-weight:900;line-height:1.15;text-wrap:balance;letter-spacing:-.01em;margin:8px 0 10px;overflow-wrap:anywhere}
.lede{font-size:clamp(16px,2.2vw,19px);max-width:62ch;color:var(--muted);margin:0 0 14px;overflow-wrap:anywhere}
section{margin-top:clamp(34px,6vw,60px);scroll-margin-top:60px}
section:first-of-type{margin-top:clamp(24px,4vw,40px)}
h2{font-size:clamp(19px,2.6vw,25px);font-weight:900;margin:0 0 14px;line-height:1.3;scroll-margin-top:60px}
h2[data-n]::before{content:attr(data-n);font-family:var(--mono);font-size:.62em;font-weight:700;background:var(--uc);color:var(--onbrand);
  border-radius:6px;padding:2px 9px;margin-right:10px;vertical-align:.14em}
h3{font-size:15px;font-weight:700;color:var(--uc);margin:0 0 6px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card.bar{border-left:4px solid var(--uc)}
/* 徽章、膠囊、按鈕 */
.tag{font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;background:var(--uc);color:var(--onbrand);white-space:nowrap;display:inline-block;line-height:1.7}
.tag.soft{background:var(--surface2);color:var(--muted);border:1px dashed var(--hair)}
.tag.lic{background:color-mix(in srgb,var(--uc) 14%,var(--surface));color:var(--uc);font-weight:600}
.tag.thesis{background:var(--u5);color:var(--onbrand)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--hair);border-radius:8px;padding:6px 12px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent2);color:var(--ink)}
.btn[aria-pressed=true],.btn.primary{background:var(--uc);color:var(--onbrand);border-color:var(--uc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:12.5px;border-radius:99px;border:1px solid var(--hair);background:var(--surface2);color:var(--muted);padding:3px 13px}
.chips button:hover{border-color:var(--accent2)}
.chips button[aria-pressed=true]{background:var(--uc);color:var(--onbrand);border-color:var(--uc);font-weight:700}
input[type=search]{width:100%;border:1px solid var(--hair);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;min-width:0}
/* 提示框（學習單 .tipbox / .warn） */
.warn{background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-left:5px solid var(--warn);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14px}
.warn .wt,.tipbox .plabel{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;display:block;margin-bottom:4px}
.warn .wt{color:var(--warn)}
.tipbox{background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14.5px;box-shadow:var(--shadow)}
.tipbox .plabel{color:var(--accent);font-size:10.5px;text-transform:uppercase}
.tipbox ol{margin:6px 0 0;padding-left:22px}.tipbox li{margin:6px 0}
dl.facts{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
dl.facts dt{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* 頁尾 */
.foot{margin-top:clamp(34px,6vw,60px);border-top:1px solid var(--hair);padding-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}
.foot p{margin:0 0 6px}
@media(max-width:640px){dl.facts{grid-template-columns:minmax(0,1fr)}dl.facts dt{padding-top:6px}}
@media(max-width:480px){.card{padding:14px}.tabs a,.tabs .tab{padding:6px 9px}}
@media print{.tabs,.btn{display:none}body{background:#fff}}

html.lib-gated body{visibility:hidden}
/* 目錄頁（沿用 ↳校⑫ 第二版設計） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.lib{background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--uc);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;color:inherit;text-decoration:none;overflow:hidden;min-width:0;cursor:pointer}
.lib:hover{border-color:var(--accent2);border-left-color:var(--uc)}
.lib .th{aspect-ratio:16/9;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center}.lib .th img{width:100%;height:100%;object-fit:cover;display:block}.thfb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;background:color-mix(in srgb,var(--uc) 16%,var(--surface2));color:var(--uc)}.thfb b{font-size:20px;font-weight:900;letter-spacing:.02em;overflow-wrap:anywhere}.thfb span{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em}
.lib .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.lib .t{font-weight:700;font-size:15.5px;line-height:1.4;overflow-wrap:anywhere}
.lib .en,.lib .au{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lib .eb{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;font-weight:600;color:var(--uc);overflow-wrap:anywhere}
.group{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.chips button .n{font-family:var(--mono);font-size:11px;margin-left:5px;opacity:.85}
.cnt{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted)}
:root:not([data-theme="dark"]){--tr-research:#3B4BD8;--tr-teaching:#0B7D3E;--tr-work:#A65A00;--tr-research-soft:#E8EBFF;--tr-teaching-soft:#E3F5EA;--tr-work-soft:#FFF3DC;--tr-on:#fff}
:root[data-theme="dark"]{--tr-research:#9DB0FF;--tr-teaching:#7BE495;--tr-work:#FFB830;--tr-research-soft:#232C57;--tr-teaching-soft:#163A24;--tr-work-soft:#43301A;--tr-on:#16130f}
/* 單篇頁 */
.back{display:inline-block;margin:0 0 10px;font-family:var(--mono);font-size:12.5px;color:var(--accent);text-decoration:none}
.media{display:grid;gap:14px}
.mbox{border:1px dashed var(--hair);border-radius:10px;padding:14px;background:var(--surface2);color:var(--muted);font-size:14px}
.mbox.denied{border-color:var(--warn);color:var(--warn)}
audio{width:100%;display:block}
.dv{width:100%;border:0;border-radius:8px;background:var(--surface2);display:block}
.dv.a{height:240px}.dv.i{height:min(78vh,900px)}.dv.s{height:min(70vh,760px);aspect-ratio:auto}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.info img,.sl img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--hair)}
.sl .nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
/* 問 AI 助教 */
.ask{border:1px solid var(--hair);border-left:4px solid var(--uc,var(--accent));border-radius:12px;background:var(--surface);padding:14px 16px;display:grid;gap:10px}
.ask{grid-template-columns:minmax(0,1fr)}.ask>*{min-width:0}.ask select{width:100%}
.ask .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ask input[type=text]{flex:1 1 220px;min-width:0;border:1px solid var(--hair);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.ask select{border:1px solid var(--hair);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
.ask .eg{display:flex;gap:6px;flex-wrap:wrap}.ask .eg button{font:inherit;font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--hair);border-radius:99px;padding:3px 11px;cursor:pointer}
.ask .ans{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:15px;border-top:1px dashed var(--hair);padding-top:10px}
.ask .ans a{color:var(--accent);font-family:var(--mono);font-size:12.5px;text-decoration:none;border:1px solid var(--hair);border-radius:6px;padding:0 6px;margin:0 2px;white-space:nowrap;display:inline-block}
.ask .ans a:hover{border-color:var(--accent2)}
.ask .ans.err{color:var(--warn)}
.ask .note{font-size:12.5px;color:var(--muted);margin:0}
/* 本頁目錄（沿用成品版）*/
.toc-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1260px;margin:0 auto;align-items:start}.toc-wrap>main{max-width:none;margin:0;min-width:0}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);font-size:.82rem;line-height:1.5;border-left:2px solid var(--hair);padding:2px 0 2px 12px;max-height:calc(100vh - 100px);overflow:auto;margin-top:28px}nav.toc .toc-t{font-weight:700;opacity:.78;letter-spacing:.08em;font-size:.74rem;margin-bottom:6px}nav.toc a{display:block;color:inherit;opacity:.8;text-decoration:none;padding:3px 0}nav.toc a:hover,nav.toc a:focus-visible{opacity:1;outline:none}
@media (max-width:860px){.toc-wrap{grid-template-columns:minmax(0,1fr)}nav.toc{display:none}}
.tabs .tnav{display:flex;gap:4px;align-items:center}
/* 單篇頁：播放卡、資訊圖／簡報分頁、全螢幕（沿用成品版）*/
.player{display:flex;flex-direction:column;gap:10px}.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}.sub{margin:0;font-size:13px;color:var(--muted)}
.vtabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--hair)}.vtabs button{border:0;background:none;padding:7px 14px;border-bottom:3px solid transparent;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}.vtabs button[aria-selected=true]{border-bottom-color:var(--uc);color:var(--uc);font-weight:700}
.info img{width:100%;height:auto;border-radius:8px;cursor:zoom-in;display:block;border:1px solid var(--hair)}
.nav2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.foot{margin-top:clamp(34px,6vw,60px);border-top:1px solid var(--hair);padding-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}.foot p{margin:0 0 6px}
#fs{position:fixed;inset:0;z-index:60;background:#0b0b0a;color:#f1ede4;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#fs[hidden]{display:none}
#fs .top{display:flex;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap;background:#161512}
#fs .top button{border:1px solid #4a463d;background:#23211c;color:#f1ede4;border-radius:8px;padding:6px 14px;font:inherit;font-size:14px;min-height:40px;cursor:pointer}#fs .top button[aria-pressed=true]{background:var(--uc);border-color:var(--uc);color:var(--onbrand)}
#fs .cnt{margin-left:auto;font-family:var(--mono);font-size:12.5px;opacity:.85}
#fs .stage{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;overflow:auto}#fs .stage iframe{width:100%;height:100%;border:0;background:#111}
#fs .stage img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;display:block;cursor:zoom-in}#fs .stage.big{display:block}#fs .stage.big img{max-width:none;max-height:none;width:220%;cursor:zoom-out;margin:0}
#ta-panel.locked #ta-q{opacity:.55}
#ta-fab:focus-visible,#ta-panel button:focus-visible,#ta-panel textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#ta-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;font:inherit;font-weight:700;font-size:14px;color:var(--onbrand);background:var(--accent);border:0;border-radius:99px;padding:11px 18px;box-shadow:var(--shadow);cursor:pointer}
#ta-panel{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:61;width:min(400px,calc(100vw - 32px));max-height:min(78vh,640px);display:none;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);font-family:var(--sans)}
#ta-panel.open{display:flex}
#ta-fab .fs{display:none}
body:has(#ta-fab)::after{content:"";display:block;height:0}
@media(max-width:700px){#ta-fab{right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:52px;height:52px;padding:0;border-radius:50%;font-size:12.5px;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#ta-fab .fl{display:none}
#ta-fab .fs{display:inline}
#ta-panel{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body:has(#ta-fab)::after{height:calc(84px + env(safe-area-inset-bottom,0px))}}
#ta-body .msg.sug{background:var(--tks,var(--surface2));border:1px solid var(--tkc,var(--accent));border-left:5px solid var(--tkc,var(--accent));border-radius:12px;font-size:13.5px}
#ta-body .msg.sug .sb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#ta-body .msg.sug button{font:inherit;font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 12px;cursor:pointer;border:1px solid var(--tkc,var(--accent));background:var(--surface);color:var(--ink)}
#ta-body .msg.sug button.go{background:var(--tkc,var(--accent));color:var(--tr-on,#fff)}
#ta-body .msg.sug button.off{border-color:var(--hair);color:var(--muted);font-weight:500}
#ta-mode{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px 0}
#ta-mode button{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--hair);border-radius:99px;padding:3px 12px;cursor:pointer}
#ta-mode button[aria-pressed=true]{background:var(--uc,var(--accent));color:var(--onbrand,#fff);border-color:var(--uc,var(--accent))}
#ta-mode select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:3px 8px;max-width:100%;min-width:0}
#ta-mode select[hidden]{display:none}
#ta-quick{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px 0}
#ta-quick button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface2);border:1px solid var(--hair);border-radius:99px;padding:3px 11px;cursor:pointer;text-align:left}
#ta-quick button:hover{border-color:var(--accent2,var(--accent))}
#ta-panel header{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--hair)}
#ta-panel header b{font-size:15px}
#ta-panel header .ctx{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ta-x{font:inherit;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
#ta-body{padding:12px 14px;overflow:auto;flex:1;min-height:90px;font-size:14px;line-height:1.65}
#ta-body .rule{font-size:12.5px;color:var(--muted);margin:0 0 8px}
#ta-body .msg{margin:0 0 10px;padding:9px 11px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
#ta-body .me{background:var(--surface2)}
#ta-body .ai{background:var(--accent-soft);border-left:4px solid var(--accent)}
#ta-body .ai .vf{display:block;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--warn)}
#ta-body .err{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-left:4px solid var(--warn)}
#ta-form{padding:10px 14px 12px;border-top:1px solid var(--hair)}
#ta-q{width:100%;min-height:60px;max-height:140px;resize:vertical;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:8px;padding:8px 10px}
#ta-form .row{display:flex;align-items:center;gap:8px;margin-top:8px}
#ta-form .cnt{font-size:12px;color:var(--muted);flex:1}
#ta-send{font:inherit;font-weight:700;font-size:13.5px;color:var(--onbrand);background:var(--accent);border:0;border-radius:8px;padding:7px 16px;cursor:pointer}
#ta-send[disabled]{opacity:.5;cursor:default}
@media(max-width:480px){#ta-panel{right:8px;left:8px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
#ta-q{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;line-height:1.55;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:11px 13px;resize:vertical;transition:border-color .15s,box-shadow .15s}
#ta-q::placeholder{color:var(--muted);opacity:.65}
#ta-q:focus{outline:none;border-color:var(--uc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--uc,var(--accent)) 20%,transparent)}
#ta-send{font:inherit;font-weight:700;font-size:14.5px;color:var(--onbrand,#fff);background:var(--uc,var(--accent));border:0;border-radius:10px;padding:9px 20px;min-height:40px;cursor:pointer;transition:filter .15s,transform .05s}
#ta-send:hover{filter:brightness(1.07)}

["做生成式 AI 輔助設計學習（虛擬導師）的研究時，可當入口文獻；它只有 2 頁，細節有限，需另找完整論文補足。", "與 Chu 2015（草圖工具）搭配，討論 AI 導師與傳統草圖工具在構想發展上各扮演什麼角色。", "規劃「可操控（steerable）」導師的設計時，可作為概念先例，並用本庫的學位論文補國內的實作脈絡。"]}, {"id": "thesis_113_lai_zhizhai_aiassist", "zh": "AI 輔助設計在設計教育中的應用探索", "en": "大同大學工業設計學系(所) 碩士論文", "au": "賴芷斳", "yr": "2024", "venue": "民國 113 年", "cat": "生成式 AI 與設計學習", "type": "學位論文", "tags": ["民國 113 年（2024）", "學位論文", "國圖書目"], "n": 15, "dur": "18 分 36 秒", "use": ["撰寫文獻回顧時，可作為「AI 輔助設計進入設計教育」的國內碩士論文參考，補足期刊論文以外的脈絡。", "可從國圖書目連到論文頁，再依其參考文獻往回找值得進一步閱讀的原始研究。", "與 Huang 2025 並讀，區分碩士論文的探索層級與期刊或會議論文的證據層級，引用時寫清楚來源類型。"]}],PEND=[{"t": "學位論文（陸續加入）", "why": "已排隊 9 篇優先學位論文，等 NotebookLM 三套件（語音、簡報、資訊圖）齊全後以「目錄頁＋單篇頁」增量加入；本版先放 1 篇。學位論文書目取自國家圖書館臺灣博碩士論文網，僅供個人學術研究，本庫不放全文。"}],CASES=[{"id": "teaching-01", "類別": "教學", "track": "teaching", "標題": "把週次大綱變成 45 分鐘教案＋四級評量規準", "情境": "手上只有一份課程大綱和一份舊講義，想快速做出一堂課的教案，再做一份可以評分的規準。", "提示詞": "請讀「03_課程大綱_設計概論.md」的第 5 週和「01_設計概論講義_第5週_可供性與設計史.md」，幫我做兩份東西，先給我看，不要存檔：\n①45 分鐘教案：開場、講解、活動、收尾，每個活動標它對應的學習目標（學習目標請寫成學生能做到的行為，最多三條）。\n②評量規準：「概念使用、觀察與例子、改善建議」三個面向 × 四個等級的表格，每一格寫看得到的描述，不要用「理解」「掌握」這類看不到的詞。\n素材沒寫的內容不要補；不確定的地方標「待補」。", "產出示意": "一份兩段式文件：上半是時間軸教案（例如 0–5 分開場、5–20 分講解可供性、20–35 分觀察教室門活動……），每個活動後面標「對應目標 2」；下半是 3 個面向 × 4 級的規準表，格子是「能舉出 1 個具體例子並說明它提供哪個動作」這類可觀察描述。", "適合誰": "中小學與大學老師、補教老師、工作坊講師", "注意事項": "講義裡的事實有故意放的錯（練習素材），產出的教案若引用講義內容，要先查證再用；規準的等級差別要自己讀過一遍；學生資料不要放進對話。", "對應學習單步驟 id": ["u2-s8", "u4-s3", "u6-s3"]}, {"id": "teaching-02", "類別": "教學", "track": "teaching", "標題": "整理一批學生短文，分層寫出回饋草稿", "情境": "收到四份學生短文，想先有一份引用學生原話的回饋草稿，再由老師改成自己的語氣。", "提示詞": "請讀「02_學生作業樣本_日常物品可供性短文.md」，依作業說明裡的三個評分面向，為每位學生（用代號）各寫一段回饋草稿：①先引用學生寫的一句原話，說明好在哪裡 ②再指出一個可以改進的地方，並給一個可以追問的問題。不要給分數，不要寫學生沒寫的內容，語氣要能直接給學生看。最後另外列一張表：四份短文各自缺少哪個面向。先給我看，不要存檔。", "產出示意": "S01：引用「小鎖是灰色的，跟機身融在一起」，肯定觀察具體；建議補上『可供性』這個詞，並問『按鈕顏色提示了什麼動作？』……最後一張表：S02 缺觀察與例子、S04 改善建議偏離可供性。", "適合誰": "要批改大量短文、想統一回饋格式的老師", "注意事項": "回饋是草稿，語氣與評價要由老師決定；分數不交給 AI；真實的學生作業要先去識別，用代號。", "對應學習單步驟 id": ["u2-s5", "u4-s3", "u6-s1"]}, {"id": "teaching-03", "類別": "教學", "track": "teaching", "標題": "查核教材：三個最可疑的事實", "情境": "AI 或舊講義寫得很順，但裡面的年份、人名、出處可能不對，要在上課前自己查一次。", "提示詞": "請讀「01_設計概論講義_第5週_可供性與設計史.md」，把裡面可以被查證的說法列成清單：年份、人名、書名、地點、專有名詞的由來。每一項寫出它在講義的哪一節；在講義或資料夾裡找不到依據的標「無依據」。只列出，不要判斷對錯，也不要修改講義。存成「待查清單.md」。", "產出示意": "一張表：#、說法、所在節、依據檔案、我的查證狀態（先空白）。例如：『可供性由諾曼於 1988 年提出』第二節無依據；『包浩斯 1925 年在威瑪成立』第三節無依據。之後你自己逐項查，填『已查證（來源）／待查／有誤』。", "適合誰": "要用網路資料、舊講義或 AI 產出備課的老師", "注意事項": "請 Claude 列清單，但查證要自己打開原始來源（官方網站、書、美術館說明）；不要請 Claude 自己確認自己寫的，它會很有自信地確認錯的。", "對應學習單步驟 id": ["u5-t1", "u5-t2", "u5-t3", "u5-t5"]}, {"id": "teaching-04", "類別": "教學", "track": "teaching", "標題": "用大綱寫課程簡介，不讓 AI 編出沒有的承諾", "情境": "要把課程介紹給學生或家長，想要一頁說明，但不能出現大綱沒寫的保證。", "提示詞": "請只依「03_課程大綱_設計概論.md」，寫一頁課程說明，分四段：這門課在做什麼、你會學到什麼（對應四條課程目標）、怎麼上課、怎麼評量。大綱沒寫的內容一律不要寫，也不要承諾學習成果或就業。每一句後面用括號標出大綱的哪一節。最後列出：哪些常見問題大綱沒有答案，需要我補。先給我看，不要存檔。", "產出示意": "四段說明，每句後有（課程目標 3）這類標註；最後一份『大綱沒有答案』清單，例如：缺席規定、教材費用、是否需要自備電腦。", "適合誰": "要寫課程簡介、招生文案、家長說明的老師與課務人員", "注意事項": "文案容易被 AI 寫成『保證學會』『輕鬆上手』這類說太滿的話，產出後要逐句檢查；學分、時數與日期要對照學校公告。", "對應學習單步驟 id": ["u4-s5", "u6-s4"]}, {"id": "work-01", "類別": "工作", "track": "work", "標題": "把口語逐字稿整理成待辦清單（保留沒決議的事）", "情境": "會議逐字稿又長又口語，想要一份誰、做什麼、何時前的待辦清單，並分清已決議、未決與擱置。", "提示詞": "請讀「01_會議逐字稿_客服出貨週會1002.md」，整理成一張表：事項、負責人、期限、狀態（已決議／未決／擱置）、原文是誰說的。只依逐字稿，沒說的負責人或期限一律寫「待補」，不要替他們指派。有被要求不要外傳或不要討論的事，另外標註。最後列出『沒有負責人的事項』。先給我看，不要存檔。", "產出示意": "表格七列左右：補貨盤點（大陳，十月第二週起，已決議）；查退貨期限（小雯，本週，未決）；首次回覆目標改 4 小時（老周，待補，擱置，註：組長要求先不要在群組討論）；每週報表自動化（待補、待補）。", "適合誰": "行政、祕書、專案助理、常常要寫會議紀錄的人", "注意事項": "不要讓 AI 替沒人認領的事補負責人；逐字稿若含真實姓名與內部資訊，先改成代號再放；結論寄給別人前，自己對過一遍。", "對應學習單步驟 id": ["u2-s5", "u4-s3", "u6-s1"]}, {"id": "work-02", "類別": "工作", "track": "work", "標題": "查核營運報告的數字與引用", "情境": "同事交來一份有數字的報告，想在上呈前找出算錯、對不上、引用錯的地方。", "提示詞": "請讀「02_第三季客服與出貨營運報告.md」，把裡面的數字與引用整理成清單：數字、百分比、合計、法規或內部規定。每一項寫出它出現在哪一節，並說明它依據資料夾裡哪個檔案（例如逐字稿）；能用報告自己的表格重算的，請寫出算式；沒有依據的標「無依據」。只列出，不要修改報告，也不要自己判斷法規對不對。存成「待查清單.md」。", "產出示意": "表格：訂單成長率（摘要）— 算式 (4,820−4,300)÷4,300≈12.1%，與報告寫的 18% 不同；客訴合計（第二節）— 62+41+23=126，報告寫 136；網購鑑賞期 14 日（第四節）— 逐字稿未證實，需查法規原文。", "適合誰": "要審稿、對帳、整理主管報告的行政與營運人員", "注意事項": "算式可以讓 AI 列，但法規與規定要自己打開官方網站（例如全國法規資料庫）看現行條文；找到錯要寫進協作紀錄，不要默默改掉。", "對應學習單步驟 id": ["u5-w1", "u5-w2", "u5-w3", "u5-w5"]}, {"id": "work-03", "類別": "工作", "track": "work", "標題": "把重複性工作寫成 SOP 和規則檔", "情境": "有一項每週都要做的工作只存在某個人的腦袋裡，想讓新同事和 AI 都能照著做。", "提示詞": "請讀「03_重複性工作描述_每週客服報表彙整.md」，幫我做兩份東西，先給我看，不要存檔：\n①SOP：每一步有編號，寫「做什麼」和「怎麼知道做對了」；描述裡提到的例外（缺值、分類寫法不同、假日）要各有處理步驟。\n②CLAUDE.md 規則檔草稿：5–8 條，每條是可以檢查的行為。\n描述裡沒寫、但你覺得需要問我的事，列成『待確認的問題』，不要自己決定。", "產出示意": "SOP 八步（匯出 CSV、合併同義分類、算數字、處理缺值……），每步後有驗收句，例如『Excel 總列數等於匯出檔列數』；規則檔如『缺值不列入平均並註明筆數』『客戶姓名電話不得出現在產出』；另附 3 個待確認問題。", "適合誰": "行政、客服、財務、營運，任何有固定週期工作的人", "注意事項": "SOP 要自己照著走一遍才算數；規則檔不要放密碼或客戶資料；『不能完全交給 AI』的步驟（例如寄信、判斷紅字）要明寫。", "對應學習單步驟 id": ["u3-s2", "u3-s5", "u2-s8"]}, {"id": "work-04", "類別": "工作", "track": "work", "標題": "用樣本資料產生週報，並誠實標示缺值", "情境": "有一份匯出的工單資料，想請 AI 產生每週彙整，但資料有缺漏、分類寫法不一致。", "提示詞": "請讀「04_客服工單匯出_樣本_0921-0925.csv」，產生本週彙整：總筆數、各分類件數、平均首次回覆時數、超過 8 小時的件數。注意：①分類寫法不一致的，先列出來問我要不要合併，不要自己決定 ②首次回覆時數有缺值的，不列入平均，並告訴我是哪幾筆、共幾筆 ③每個數字旁寫算式。不要出現任何姓名或電話。先給我看，不要存檔。", "產出示意": "總筆數 24；分類原始寫法 7 種（其中『配送延誤』與『配送延遲』疑為同類，請確認）；缺值 1 筆（T26092103），其餘 23 筆平均約 6.0 小時；超過 8 小時 5 筆。每個數字旁有算式。", "適合誰": "做週報、月報的人，想把整理工作交給 AI 但要保留把關的人", "注意事項": "AI 對表格做統計容易算錯或沒告訴你它跳過了哪幾筆，所以要它寫算式、列出缺值，並自己抽算一個；真實資料先拿掉姓名電話。", "對應學習單步驟 id": ["u3-s6", "u4-s3"]}, {"id": "research-01", "類別": "研究", "track": "research", "標題": "文獻讀取紀錄表＋DOI 查證小表", "情境": "資料夾裡有幾篇文獻，想知道 Claude 對每篇實際讀到多少、DOI 能不能查到。", "提示詞": "請逐份讀資料夾裡的文獻，產出一張表：檔名、讀取程度（從「全文」「僅摘要」「影像辨識需抽查」「未讀」四個裡選一個，並說明為什麼）、三個重點（每點附原文位置）、DOI（檔內有載明才填，沒有就寫「待查」，不要猜）。原文沒寫的不要補，讀不到的要列出。存成「讀取紀錄.md」。", "產出示意": "一張表：每份文獻一列，讀取程度欄不是全部『全文』（例如掃描檔標『影像辨識需抽查』）；DOI 欄有載明才填。之後你把 DOI 貼到 doi.org 逐個查證，結果寫回『已查證／待查』。", "適合誰": "寫論文、做文獻回顧的研究生與研究者", "注意事項": "Claude 說『讀完了』不一定是真的，讀取程度要如實標；DOI 絕對不可以猜，一定自己到 doi.org 貼上去看；引用以全文為準。", "對應學習單步驟 id": ["u4-s3", "u5-s1", "u5-s3"]}, {"id": "research-02", "類別": "研究", "標題": "DOI 查證小表", "情境": "要引用幾篇文獻，想先確認 DOI 是不是真的、題名對不對。", "提示詞": "請列出「讀取紀錄.md」裡每一個檔內載明的 DOI，做成一張表：DOI、檔案裡的題名。DOI 不要補、不要猜。我會自己貼到 doi.org 查證，再把結果貼回來，請你到時再幫我整理成「已查證／待查」。", "產出示意": "一張 DOI 與題名的對照表；你查證後再補上狀態欄。", "適合誰": "寫論文、需要確認參考文獻真實性的人", "注意事項": "查證一定要自己在 doi.org 做，不要請 Claude 自己確認。", "對應學習單步驟 id": ["u5-s1", "u5-s3"], "track": "research"}, {"id": "teaching-05", "類別": "教學", "track": "teaching", "標題": "A 軌：把通用設計單元排成 2 週活動，並讓 AI 做『錯誤示範』", "情境": "要教通用設計，情境是高齡者與視障者，想把一個單元排成 2 週活動，再請 AI 產生有毛病的示範物，讓學生挑毛病。", "提示詞": "請讀「A軌_通用設計_講義_高齡情境.md」。先問我 5 個澄清問題（班級人數、先備知識、每週時數、評量方式、教室設備），等我回答後，再幫我把這個單元排成 2 週活動，每週列出：學習目標（學生能做到什麼，最多三條）、活動、對應的七項原則。另外列出 3 個『錯誤示範』的日常物品情境，讓學生挑出違反哪一項原則。標【AI 生成待核】，講義沒寫的事實不要補；先給我看，不要存檔。", "產出示意": "先列 5 個問題；回答後給兩週表：第 1 週用藥盒、遙控器逐條檢查七項原則；第 2 週針對最不及格的一項提改善。三個錯誤示範：把關鍵資訊只用顏色表示（違反可感知的資訊）等。", "適合誰": "教設計方法、通用設計、設計倫理的老師", "注意事項": "講義有 3 處故意放錯，產出若引用高齡社會定義或原則數量，要先查證；案例用虛構情境，不放真實學生或個案。", "對應學習單步驟 id": ["u2-s8", "u3-s5", "u4-s5"]}, {"id": "teaching-06", "類別": "教學", "track": "teaching", "標題": "B 軌：用『規格與製造限制檢核表』先查設計說明書的漏項", "情境": "產品設計或材料與製造的報告，想請 AI 先查有沒有漏掉材料、公差、成本，再由老師看設計判斷。", "提示詞": "請讀「B軌_產品開發_設計說明書樣本與檢核表.md」。用裡面第一節的 6 項檢核表，分別檢查作業 S11 和作業 S12，每一項回答「有／沒有／不確定」，並引用學生原話當依據。只檢查有沒有寫，不要評論設計好不好看，也不要打分數。最後列出 S12 裡可以用算式重算的數字，寫出算式。先給我看，不要存檔。", "產出示意": "S11：材料「有（寫塑膠，但沒說哪種）」、製造方式「沒有」、公差「沒有」、成本「沒有」、過程證據「沒有（只說之後做模型）」。S12 的成本表：38+48+120+9 = 215，與說明書寫的 235 不同。", "適合誰": "教產品設計、產品開發、材料與製造的老師", "注意事項": "AI 只能看文字說明與附圖，看不到實體作品，所以只檢查『有沒有寫』；設計判斷、分數由老師決定；良率等無來源的數字要標待查。", "對應學習單步驟 id": ["u2-s5", "u4-s3", "u5-t1"]}, {"id": "work-05", "類別": "工作", "track": "work", "標題": "個人品牌貼文＋自己開的課的推廣文案（只寫你給的資訊）", "情境": "自己開了一門小班課，想寫社群貼文和一頁課程說明，建立個人品牌，但不想讓 AI 編出沒有的承諾、名額或見證。", "提示詞": "我要推廣自己開的課。以下是課程資訊（虛構範例，請換成你自己的）：\n課名：〈晨光手沖咖啡入門〉；講師：〈小晨〉（品牌「晨光手作」）；對象：〈完全沒接觸過手沖的上班族〉；時間：〈每週六 10:00–12:00，共 4 週〉；地點：〈社區教室〉；名額：〈8 人〉；費用：〈NT$ 2,400〉；學員會做的事：〈每週沖一杯並寫品嚐筆記〉。\n請只依這些資訊，產出兩份東西，先給我看，不要存檔：\n①一則 150 字內的社群貼文（語氣親切、不誇大），結尾放報名方式〈請填〉。\n②一頁課程說明：這門課在做什麼、適合誰、每週內容、報名資訊。\n規則：我沒給的資訊一律標「待補」，不要編見證、學員人數、效果保證或限時優惠；不要用「保證」「一定學會」這類說太滿的詞。最後列出『你需要我補的資訊』清單。", "產出示意": "一則親切的貼文（不含見證與保證），一頁說明，與清單：缺『報名連結』『退費規則』『器材是否自備』。", "適合誰": "想開課、做自媒體或個人品牌的人：講師、工作室、斜槓工作者", "注意事項": "價格、日期、名額、退費要自己對過；不要放學員個資或真實學員見證；平台的廣告與標示規定以官方為準；成品要自己讀過再發。", "對應學習單步驟 id": ["u4-s5",       for(var i=0;i<50;i++){await sleep(1500);var g=await fetch(base+'/'+an+'/'+sid+'/'+key+'.json'+au);if(!g.ok)continue;var a=await g.json();if(a){if(a.ok)return String(a.text||'').replace(/\*\*|__|`{1,3}/g,'').replace(/^\s*[\*\-]\s+/gm,'• ').trim();throw {shown:a.text}}}
      throw {shown:'助教現在沒有回應（可能還沒開機），請稍後再試，或舉手問講師。'};
    }
    $('#ta-fab').addEventListener('click',function(){open(!$('#ta-panel').classList.contains('open'))});
    $('#ta-x').addEventListener('click',function(){open(false)});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')open(false)});
    $('#ta-q').addEventListener('input',cnt);
    $('#ta-q').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#ta-form').requestSubmit()}});
    [].slice.call(document.querySelectorAll('#ta-mode button')).forEach(function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-m'))})});
    $('#ta-form').addEventListener('submit',async function(ev){
      ev.preventDefault();var q=$('#ta-q').value.trim();if(!q||busy)return;busy=true;$('#ta-send').disabled=true;add('me',q);$('#ta-q').value='';cnt();
      var w=add('ai','AI助教想一下…');
      try{var t=await ask(q);w.textContent='';fill(w,t)}catch(e){w.className='msg err';w.textContent=(e&&e.shown)||'AI助教暫時不能用，請舉手問講師。'}
      busy=false;$('#ta-send').disabled=false;
    });
    window.__taLib={setMode:setMode,open:open};
    setMode('lib');
  })();
  /* ===== 應用案例單頁：情境、提示詞、產出示意、適合誰、注意事項、在學習單哪裡練習（不用 Drive 媒體）===== */
  function caseView(id){
    var c=CBYID[id];if(!c){location.hash='#/';return}
    var uc='var('+(TCOL[c['類別']]||'--u3')+')',steps=(c['對應學習單步驟 id']||[]);
    $('#view').innerHTML='<div style="--uc:'+uc+'"><div class="eyebrow">應用案例 · '+esc(c['類別'])+'線</div><h1>'+esc(c['標題'])+'</h1><p class="lede">'+esc(c['情境'])+'</p><div class="tags"><span class="tag" style="background:'+uc+';color:var(--tr-on)">'+esc(c['類別'])+'線</span><span class="tag soft">案例為示範素材（虛構資料）</span></div>'+
      '<section><h2 id="c-prompt" data-n="01">提示詞（可直接複製）</h2><div class="card bar"><pre id="cpre" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px;font:inherit;font-size:14.5px;line-height:1.7"></pre><button type="button" class="btn primary" id="ccopy">複製提示詞</button> <span class="sub" id="cmsg" role="status"></span></div></section>'+
      '<section><h2 id="c-out" data-n="02">產出長什麼樣子（示意）</h2><div class="card"><p style="margin:0;overflow-wrap:anywhere">'+esc(c['產出示意'])+'</p></div></section>'+
      '<section><h2 id="c-note" data-n="03">適合誰、注意事項</h2><div class="card bar"><dl class="facts"><dt>適合誰</dt><dd>'+esc(c['適合誰'])+'</dd><dt>注意事項</dt><dd>'+esc(c['注意事項'])+'</dd></dl></div></section>'+
      '<section><h2 id="c-steps" data-n="04">在學習單哪裡練習</h2><div class="tags">'+(steps.length?steps.map(function(x){return '<a class="btn" href="sheet.html#'+esc(x)+'">步驟 '+esc(x)+'</a>'}).join(''):'<span class="sub">沒有對應的步驟。</span>')+'</div></section>'+
      '<div class="foot"><p>案例內容為示範用，檔名與資料均為虛構的練習素材；提示詞的產出請自己對照原文或畫面驗證，我可能說錯。</p></div></div>';
    $('#cpre').textContent=c['提示詞'];
    $('#ccopy').onclick=function(){var m=$('#cmsg');function ok(){m.textContent='已複製。'}function fb(){var r=document.createRange();r.selectNodeContents($('#cpre'));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);m.textContent='請按 Ctrl+C 複製（已選取）。'}try{navigator.clipboard.writeText(c['提示詞']).then(ok,fb)}catch(e){fb()}};
    setNav([['c-prompt','提示詞'],['c-out','產出示意'],['c-note','適合誰與注意事項'],['c-steps','在學習單練習']],true);if(window.__taPaper)window.__taPaper({id:c.id,zh:c['標題']});window.scrollTo(0,0);
  }
  function route(){var m=/^#\/p\/([A-Za-z0-9_-]+)/.exec(location.hash),c=/^#\/c\/([A-Za-z0-9_-]+)/.exec(location.hash);if(m)paper(m[1]);else if(c)caseView(c[1]);else hub()}
  window.addEventListener('hashchange',function(){if(!$('#app').hidden)route()});
  window.__lib={items:ITEMS,route:route};
  boot();
})();
</script>
