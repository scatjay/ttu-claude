  var UN={pre:'開始前',u1:'單元 1',u2:'單元 2',u3:'單元 3',u4:'單元 4',u5:'單元 5',u6:'單元 6',fin:'總檢核'};

      var row=el('div','row');row.appendChild(el('div','nm',UN[x.u]||x.u));
      var b=el('div','bar');var i=el('i');i.style.width=pct(x.gateAny,s.students)+'%';b.appendChild(i);row.appendChild(b);
      var n=el('div','num');n.innerHTML='過關 <b>'+f(x.gateAny)+'</b>　卡關 <b>'+f(x.stuck)+'</b>　問助教 <b>'+f(x.asks)+'</b>';row.appendChild(n);u.appendChild(row)});
    var h=$('hot');h.textContent='';

    var mx=Math.max.apply(null,(s.stuckTop||[]).map(function(x){return x.n}).concat([1]));

      var d=el('div','hot');var t=el('div','t',STEPS[x.key]||x.key);t.appendChild(el('small','',(UN[x.unit]||x.unit)+'　'+x.key));d.appendChild(t);d.appendChild(el('div','c',f(x.n)+' 次'));

  var C=window.TA_CFG||{},RT=(C.db||'').replace(/\/$/,'')+'/dt1116/'+C.sess,TOK='',AUTH=null;

  async function get(p){var r=await fetch(RT+'/'+p+'.json'+qs());if(r.status===401||r.status===403)throw {code:'denied'};if(!r.ok)throw {code:'http_'+r.status};return r.json()}
  var FX=32;
